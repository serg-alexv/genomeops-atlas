name: LAB R-M genome discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "analyses/lab-rm-phylogenomics/**"
      - ".github/workflows/lab-rm-genome-discovery.yml"
  issues:
    types: [opened]
  push:
    branches:
      - main
    paths:
      - "analyses/lab-rm-phylogenomics/**"
      - ".github/workflows/lab-rm-genome-discovery.yml"

permissions:
  contents: read

concurrency:
  group: lab-rm-discovery-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  discover-genomes:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[RUN] LAB R-M Stage 1')
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Clean prior generated output
        run: |
          rm -rf analyses/lab-rm-phylogenomics/work/stage1
          rm -rf analyses/lab-rm-phylogenomics/results/stage1

      - name: Discover and rank annotated RefSeq assemblies
        run: |
          chmod +x analyses/lab-rm-phylogenomics/scripts/discover_genomes.sh
          analyses/lab-rm-phylogenomics/scripts/discover_genomes.sh analyses/lab-rm-phylogenomics

      - name: Validate discovery output
        run: |
          set -euo pipefail
          test -s analyses/lab-rm-phylogenomics/results/stage1/all_candidates.tsv
          test -s analyses/lab-rm-phylogenomics/results/stage1/selected_panel.tsv
          test -s analyses/lab-rm-phylogenomics/results/stage1/DISCOVERY_SUMMARY.md
          selected=$(( $(wc -l < analyses/lab-rm-phylogenomics/results/stage1/selected_panel.tsv) - 1 ))
          echo "Selected assemblies: ${selected}"
          if (( selected < 140 || selected > 200 )); then
            echo "::warning::Panel size ${selected} is outside the preferred 140-200 range; artifact retained for inspection."
          fi

      - name: Print discovery summary
        if: always()
        run: |
          if [[ -s analyses/lab-rm-phylogenomics/results/stage1/DISCOVERY_SUMMARY.md ]]; then
            cat analyses/lab-rm-phylogenomics/results/stage1/DISCOVERY_SUMMARY.md
          fi

      - name: Upload discovery dataset
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lab-rm-stage1-genome-discovery
          path: analyses/lab-rm-phylogenomics/results/stage1/
          if-no-files-found: error
          retention-days: 30

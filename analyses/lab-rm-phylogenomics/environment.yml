name: lab-rm-stage2

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # ── Python runtime ─────────────────────────────────────────────────────────
  - python=3.11.*

  # ── NCBI Datasets CLI (installed via script, not conda) ────────────────────
  # Pinned to current stable v2 at download time; version captured in
  # results/stage2/ncbi_datasets_version.txt

  # ── Phylogenomics ──────────────────────────────────────────────────────────
  - gtotree>=1.8.6           # GToTree with Firmicutes_and_Tenericutes HMMs
  - iqtree>=2.2.6            # IQ-TREE 2 for ML tree inference
  - mafft>=7.520             # MSA (used internally by GToTree)
  - trimal>=1.4.1            # Alignment trimming
  - hmmer>=3.4               # Profile HMM search (GToTree dependency)
  - fasttree>=2.1.11         # Optional fast tree (GToTree uses IQ-TREE here)
  - ete3>=3.1.3              # Tree manipulation (prune outgroups)

  # ── R-M annotation ─────────────────────────────────────────────────────────
  - defense-finder>=1.3.0    # DefenseFinder (MacSyFinder-based)
  - macsyfinder>=2.1.4       # DefenseFinder dependency

  # ── Utilities ──────────────────────────────────────────────────────────────
  - unzip
  - curl
  - sed
  - gawk

  # ── Python packages ────────────────────────────────────────────────────────
  - pip:
    - biopython>=1.83

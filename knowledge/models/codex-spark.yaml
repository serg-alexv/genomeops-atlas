id: codex-spark
tool:
  name: GPT-5.3-Codex-Spark
  provider: OpenAI
  official_status: research preview
category:
  - coding
  - rapid_iteration
  - ui_development
  - repository_tasks
role: Fast engineering iteration
positioning: Ultra-fast engineering loop accelerator, not a scientific authority.
strengths:
  - extremely fast feedback loop
  - small targeted edits
  - frontend iteration
  - refactoring assistance
  - test scaffolding
weaknesses:
  - not the primary architecture planner
  - not ideal for ambiguous scientific reasoning
  - generated assumptions require verification
best_used_for:
  - Create a React component
  - Fix a TypeScript error
  - Refactor one module
  - Review a focused PR diff
  - Generate documentation updates
avoid:
  - Design a complete genome engineering strategy
  - Make biological conclusions without evidence
workflow_position:
  before:
    - human or model architecture decision
  during:
    - targeted implementation loop
  after:
    - tests and human review
evidence:
  source: https://learn.chatgpt.com/docs/agent-configuration/speed#codex-spark
  changelog: https://learn.chatgpt.com/docs/changelog#codex-2026-02-12
  verified_on: 2026-08-18
  official_claims:
    - Separate, fast, less-capable Codex model optimized for near-instant real-time coding iteration.
    - At launch it was text-only with a 128k context window.
    - During research preview it is available to ChatGPT Pro subscribers.
